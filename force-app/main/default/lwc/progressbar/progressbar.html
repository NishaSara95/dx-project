<template>
      <lightning-card title="Progress" icon-name="custom:custom34">
        <div class="slds-var-m-around_medium">
            <lightning-input
                label="Percentage"
                type="number"
                min="0"
                max="100"
                value={percentage}
                onchange={handlePercentageChange}
            ></lightning-input>
            <fieldset class="slds-var-p-around_x-small">
                <legend>Progress</legend>
                <c-progressbar-child percentage={percentage}></c-progressbar-child>
            </fieldset>
        </div>
    </lightning-card>
</template>
